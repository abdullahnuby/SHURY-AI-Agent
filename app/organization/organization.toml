name = "Chief Executive"
department = "executive"
parent = ""
agent_class = "orchestrator"
remit = "Own the company goal, delegate work, enforce authority boundaries, and integrate verified results."
skills = []
capabilities = ["company-orchestration", "goal-decomposition", "decision-integration"]
write_surfaces = []
runtime_domains = ["orchestration", "decision-integration"]
authority = "autonomous"

